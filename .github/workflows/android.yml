name: Ashen Vale · Android
on:
  workflow_dispatch:
  push:
    branches: [arena/719cd1f5-ashen-vale]
permissions:
  contents: write
jobs:
  episode:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build:episode1]') || contains(github.event.head_commit.message, '[toolchain:episode1]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ashen-tools/4.4.1
          key: godot-official-4.4.1-android-v1
      - run: bash tools/engine.sh
      - name: Build and verify native Android chapter
        if: "!contains(github.event.head_commit.message, '[toolchain:episode1]')"
        run: bash tools/ci-build.sh
      - name: Stage verified package for offline signing
        id: handoff
        if: contains(github.event.head_commit.message, '[build:episode1]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/signing_transport.py
      - uses: actions/upload-artifact@v4
        if: "!contains(github.event.head_commit.message, '[toolchain:episode1]')"
        with:
          name: Unsigned-for-offline-signing-${{ steps.handoff.outputs.ref }}
          path: build/android/*.apk
          if-no-files-found: error
      - name: Save visual and build evidence
        if: always() && !contains(github.event.head_commit.message, '[toolchain:episode1]')
        uses: actions/upload-artifact@v4
        with:
          name: Chapter-QA
          path: |
            build/*.log
            build/shots/*.png
          if-no-files-found: ignore
