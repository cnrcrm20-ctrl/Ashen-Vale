name: Ashen Vale · Android
on:
  workflow_dispatch:
  push:
    branches: [arena/719cd1f5-ashen-vale]
permissions:
  contents: read
jobs:
  episode:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build:episode1]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and verify native Android chapter
        run: bash tools/ci-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Ashen-Vale-Episode-1
          path: build/android/*.apk
          if-no-files-found: error
